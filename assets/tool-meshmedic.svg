<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 154" width="1200" height="154" role="img" aria-label="MeshMedic: Matches Istio's Prometheus telemetry against reviewed failure scenarios and opens a GitOps pull request with the diagnosis, evidence and rollback plan. Status: v1.0.0.">
<style>
@font-face { font-family: 'Display'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'Sans'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
svg { --bg: #0c0a09; --raised: #171310; --border: #3a2f28; --strong: #f4ece2; --body: #d1c3b4; --muted: #968779; --vital: #c7331e; --review: #d9a441; --merged: #7fb069; --trace: #c7331e; --glow: .3; --dots: .1; --paper: 0 }
@media (prefers-color-scheme: light) { svg { --bg: #ffffff; --raised: #f6f9fc; --border: #d6e0e9; --strong: #0f1c2a; --body: #2d3d4e; --muted: #5e7082; --vital: #dc383e; --review: #a8720f; --merged: #16803f; --trace: #0f1c2a; --glow: 0; --dots: 0; --paper: 1 } }
.shell { fill: var(--bg); stroke: var(--border); }
.n    { font: 600 28px 'Display', Georgia, serif; fill: var(--strong); }
.num  { font: 600 56px 'Display', Georgia, serif; fill: var(--strong); }
.s    { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: var(--body); }
.st   { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: var(--strong); }
.d    { font: 500 16px 'Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: var(--muted); }
.db   { font: 500 16px 'Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: var(--body); }
.hair { stroke: var(--border); }
.pill { fill: none; stroke: var(--muted); }
.dm   { fill: var(--merged); }
.dr   { fill: var(--review); }

</style>
<rect class="shell" x=".5" y=".5" width="1199" height="153" rx="18"/>
<text class="n" x="40" y="54">MeshMedic</text>
<text class="s" x="350" y="54">Matches Istio's Prometheus telemetry against reviewed failure</text>
<text class="s" x="350" y="84">scenarios and opens a GitOps pull request with the diagnosis, evidence</text>
<text class="s" x="350" y="114">and rollback plan</text>
<rect class="pill" x="1074.4" y="33.0" width="85.6" height="30" rx="15"/>
<text class="db" x="1117.2" y="53" text-anchor="middle">v1.0.0</text>
</svg>
