<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Git Hospital: Open-source tools that diagnose infrastructure and code, with the evidence for every diagnosis. Tools: helmbulance, Helm chart day-2 tests; meshmedic, Istio alerts to fix PRs; boards, scores diagnosis tools; githealthcheck, code health, measured.">
<style>
@font-face { font-family: 'Display'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'Sans'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
.display { font: 600 76px 'Display', Georgia, serif; fill: #f4ece2; letter-spacing: -1.5px; }
.title   { font: 500 28px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: #d1c3b4; }
.body    { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: #968779; }
.mono    { font: 500 15px 'Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #968779; letter-spacing: .3px; }
.rise    { opacity: 0; animation: rise .9s ease-out forwards; }
.grow    { transform-box: fill-box; transform-origin: left; animation: grow 1.1s ease-out .5s both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.gh-title { font: 600 68px 'Display', Georgia, serif; fill: #f4ece2; letter-spacing: -1px; }
.lead { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: #d1c3b4; }
.tool { font: 500 17px 'Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #f4ece2; }
.drive { animation: drive 9s cubic-bezier(.35,0,.65,1) infinite; }
.titlefade { animation: titlefade 9s linear infinite; }
.wheel { transform-box: fill-box; transform-origin: center; animation: spin .45s linear infinite; }
.flash { animation: flash .5s steps(1) infinite; }
.fb { animation-delay: .25s; }
.wave { transform-box: fill-box; transform-origin: center; opacity: 0; animation: wave 1.35s ease-out infinite; }
.speed { animation: speed .5s ease-in-out infinite alternate; }
@keyframes drive { 0% { transform: translateX(-900px); } 48%, 100% { transform: translateX(680px); } }
@keyframes titlefade { 0%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { opacity: 1; } 50% { opacity: .12; } }
@keyframes wave { 0% { opacity: .9; transform: scale(.5); } 100% { opacity: 0; transform: scale(2.6); } }
@keyframes speed { from { opacity: .15; } to { opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .wave, .speed { opacity: 0 !important; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f4ece2" fill-opacity=".07"/></pattern><clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath></defs>
<defs><clipPath id="trail"><rect class="drive" x="-1760" y="0" width="2400" height="192"/></clipPath><radialGradient id="glow-r"><stop offset="0" stop-color="#c7331e" stop-opacity=".75"/><stop offset="1" stop-color="#c7331e" stop-opacity="0"/></radialGradient><radialGradient id="glow-b"><stop offset="0" stop-color="#3b82f6" stop-opacity=".75"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a441" stop-opacity=".45"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#frame)">
<rect width="1200" height="400" fill="#171310"/>
<rect width="1200" height="400" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="#3a2f28"/>
<text class="mono rise" x="70" y="54">// founder and maintainer</text>
<text class="mono rise" x="1130" y="54" text-anchor="end">github.com/Git-Hospital</text>
<line x1="0" y1="182" x2="1200" y2="182" stroke="#695c51" stroke-opacity=".7" stroke-dasharray="22 16"/>
<g clip-path="url(#trail)"><g class="titlefade"><text class="gh-title" x="66" y="160">Git Hospital</text></g></g>
<g transform="translate(640 182)"><g class="drive"><line class="speed" x1="-70" y1="-62" x2="-18" y2="-62" stroke="#968779" stroke-width="2" stroke-linecap="round" style="animation-delay:0.00s"/><line class="speed" x1="-48" y1="-44" x2="-18" y2="-44" stroke="#968779" stroke-width="2" stroke-linecap="round" style="animation-delay:0.22s"/><line class="speed" x1="-60" y1="-26" x2="-18" y2="-26" stroke="#968779" stroke-width="2" stroke-linecap="round" style="animation-delay:0.10s"/><path d="M204 -27 L300 -52 L300 -2 Z" fill="url(#beam)"/><ellipse cx="103" cy="0" rx="112" ry="5" fill="#000" fill-opacity=".45"/><circle class="wave" cx="163" cy="-83" r="16" fill="none" stroke="#c7331e" stroke-width="2" style="animation-delay:0.00s"/><circle class="wave" cx="163" cy="-83" r="16" fill="none" stroke="#3b82f6" stroke-width="2" style="animation-delay:0.45s"/><circle class="wave" cx="163" cy="-83" r="16" fill="none" stroke="#c7331e" stroke-width="2" style="animation-delay:0.90s"/><rect x="0" y="-80" width="146" height="66" rx="6" fill="#f4ece2"/><path d="M140 -80 L170 -80 L196 -52 L207 -47 L207 -20 Q207 -14 201 -14 L140 -14 Z" fill="#f4ece2"/><path d="M150 -72 L167 -72 L187 -52 L150 -52 Z" fill="#2b3138"/><rect x="0" y="-38" width="207" height="7" fill="#c7331e"/><rect x="60" y="-68" width="8" height="24" rx="1.5" fill="#c7331e"/><rect x="52" y="-60" width="24" height="8" rx="1.5" fill="#c7331e"/><line x1="140" y1="-50" x2="140" y2="-16" stroke="#968779" stroke-opacity=".6"/><rect x="200" y="-30" width="7" height="6" rx="1.5" fill="#d9a441"/><rect x="-3" y="-22" width="8" height="6" rx="1.5" fill="#c7331e"/><rect x="146" y="-82" width="34" height="4" rx="2" fill="#968779"/><circle class="flash fa" cx="156" cy="-82" r="22" fill="url(#glow-r)"/><rect class="flash fa" x="150" y="-87" width="12" height="9" rx="2" fill="#c7331e"/><circle class="flash fb" cx="170" cy="-82" r="22" fill="url(#glow-b)"/><rect class="flash fb" x="164" y="-87" width="12" height="9" rx="2" fill="#3b82f6"/><circle cx="42" cy="-12" r="13" fill="#1b1714" stroke="#695c51" stroke-width="3"/><g class="wheel"><line x1="42" y1="-12" x2="49.0" y2="-12.0" stroke="#968779" stroke-width="2"/><line x1="42" y1="-12" x2="38.5" y2="-5.9" stroke="#968779" stroke-width="2"/><line x1="42" y1="-12" x2="38.5" y2="-18.1" stroke="#968779" stroke-width="2"/><circle cx="42" cy="-12" r="2.5" fill="#d1c3b4"/></g><circle cx="168" cy="-12" r="13" fill="#1b1714" stroke="#695c51" stroke-width="3"/><g class="wheel"><line x1="168" y1="-12" x2="175.0" y2="-12.0" stroke="#968779" stroke-width="2"/><line x1="168" y1="-12" x2="164.5" y2="-5.9" stroke="#968779" stroke-width="2"/><line x1="168" y1="-12" x2="164.5" y2="-18.1" stroke="#968779" stroke-width="2"/><circle cx="168" cy="-12" r="2.5" fill="#d1c3b4"/></g></g></g>
<text class="lead rise" x="70" y="236" style="animation-delay:.3s">Open-source tools that diagnose infrastructure and code, with the evidence for every diagnosis.</text>
<line x1="70" y1="282" x2="1130" y2="282" stroke="#3a2f28"/>
<text class="tool rise" x="70.0" y="324" style="animation-delay:0.5s">helmbulance</text>
<text class="mono rise" x="70.0" y="352" style="animation-delay:0.5s">Helm chart day-2 tests</text>
<text class="tool rise" x="335.0" y="324" style="animation-delay:0.6s">meshmedic</text>
<text class="mono rise" x="335.0" y="352" style="animation-delay:0.6s">Istio alerts to fix PRs</text>
<text class="tool rise" x="600.0" y="324" style="animation-delay:0.7s">boards</text>
<text class="mono rise" x="600.0" y="352" style="animation-delay:0.7s">scores diagnosis tools</text>
<text class="tool rise" x="865.0" y="324" style="animation-delay:0.8s">githealthcheck</text>
<text class="mono rise" x="865.0" y="352" style="animation-delay:0.8s">code health, measured</text>
</g>
</svg>
