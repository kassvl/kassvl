<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 124" width="1200" height="124" role="img" aria-label="GitHealthCheck: Code health analyzer: tests, history, complexity. Every number is a measurement, or null with a reason. Status: Go rewrite in progress.">
<style>
@font-face { font-family: 'Display'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'Sans'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
svg { --bg: #0c0a09; --raised: #171310; --border: #3a2f28; --strong: #f4ece2; --body: #d1c3b4; --muted: #968779; --vital: #c7331e; --review: #d9a441; --merged: #7fb069; --trace: #c7331e; --glow: .3; --dots: .1 }
.n    { font: 600 28px 'Display', Georgia, serif; fill: var(--strong); }
.num  { font: 600 56px 'Display', Georgia, serif; fill: var(--strong); }
.s    { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: var(--body); }
.st   { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: var(--strong); }
.h    { font: 600 30px 'Display', Georgia, serif; fill: var(--strong); }
.sm   { font: 400 20px 'Sans', 'Helvetica Neue', Arial, sans-serif; fill: var(--muted); }
.d    { font: 500 16px 'Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: var(--muted); }
.db   { font: 500 16px 'Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: var(--body); }
.hair { stroke: var(--border); }
.pill { fill: none; stroke: var(--muted); }
.dm   { fill: var(--merged); }
.dr   { fill: var(--review); }

</style>
<path d="M0 0 H1200 V124 H0 Z" fill="#0c0a09"/>
<text class="n" x="40" y="54">GitHealthCheck</text>
<text class="s" x="350" y="54">Code health analyzer: tests, history, complexity. Every</text>
<text class="s" x="350" y="84">number is a measurement, or null with a reason</text>
<rect class="pill" x="920.8" y="33.0" width="239.2" height="30" rx="15"/>
<text class="db" x="1040.4" y="53" text-anchor="middle">Go rewrite in progress</text>
<path d="M.5 0 V124 M1199.5 0 V124" fill="none" stroke="#3a2f28" stroke-width="1"/><line x1="0" y1="123.5" x2="1200" y2="123.5" fill="none" stroke="#3a2f28" stroke-width="1"/>
</svg>
