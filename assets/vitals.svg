.hair { stroke: var(--border); }
.pill { fill: none; stroke: var(--muted); }
.dm   { fill: var(--merged); }
.dr   { fill: var(--review); }
svg { --len: 5564; }
.gd { fill: var(--strong); } .dg { opacity: var(--dots); }
.ref { stroke: var(--muted); stroke-opacity: .45; stroke-dasharray: 2 5; }
