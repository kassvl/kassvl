<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 294" width="440" height="294" preserveAspectRatio="none" role="img" aria-label="MeshMedic: Matches Istio's Prometheus telemetry against reviewed failure scenarios and opens a GitOps pull request with the diagnosis, evidence and rollback plan. Status: v1.0.0.">
<style>
@font-face { font-family: 'Display'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
