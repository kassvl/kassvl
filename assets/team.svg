<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 546" width="1200" height="546" role="img" aria-label="Team products, private repos, happy to walk through the code. EmlakPlus: Largest contributor (team of 4) to a CRM for real-estate agencies: listings, clients, map search, scheduled social posts. Built with FastAPI, Next.js, PostgreSQL, Redis, Celery, Terraform. data-stock: REST API and admin web of an inventory SaaS that logs stock by barcode and syncs Amazon, Allegro and eBay listings. Built with FastAPI, Alembic, React, Vite, Playwright. Vantage: TypeScript API of an Instagram analytics app: Graph API login, ad-supported free tier, Fly.io deploys. Built with Node.js, TypeScript, Docker, Fly.io.">
